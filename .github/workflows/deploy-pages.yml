name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
      - name: Enable GitHub Pages from gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/pages" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -f build_type=legacy \
            -f source[branch]=gh-pages \
            -f source[path]=/
          status=$?
          if [ "$status" -ne 0 ]; then
            gh api "repos/${GITHUB_REPOSITORY}/pages" \
              -X PUT \
              -H "Accept: application/vnd.github+json" \
              -f build_type=legacy \
              -f source[branch]=gh-pages \
              -f source[path]=/ || true
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pages" || true
